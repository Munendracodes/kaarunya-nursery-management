name: kaarunyanursery
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Core UI and responsive design
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1

  # Feature dependencies
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.2
  url_launcher: ^6.3.2

  # Firebase dependencies
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_database: ^12.4.7
  firebase_storage: ^13.4.6

  universal_html: ^2.2.4
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

# ============================================================
# ANDROID APP LAUNCHER ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/kaarunya_app_icon.png"
  min_sdk_android: 21

# ============================================================
# ASSET MANAGEMENT
# ============================================================
#
# Only use the existing:
# - assets/
# - assets/images/
#
# ============================================================